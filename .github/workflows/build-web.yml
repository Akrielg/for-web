name: build-web

# Build the rebranded Spiraliis web client and push it to GHCR.
# Consumed by desktop staging and (later) prod.

on:
  push:
    branches: [spiraliis]
    paths:
      - "packages/**"
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/build-web.yml"
  workflow_dispatch: {}

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Init only the PUBLIC submodules the build needs; skip the private brand
      # assets submodule (packages/client/assets) so the build falls back to our
      # own assets_fallback/ — which contains the Spiraliis wordmark.
      - name: Init public submodules
        run: |
          git submodule update --init --recursive \
            packages/stoat.js \
            packages/solid-livekit-components \
            packages/js-lingui-solid

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/spiraliis-web
          tags: |
            type=raw,value=staging
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_PATH=/
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
